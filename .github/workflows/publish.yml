name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - name: Verify tack.min.js is up to date
        run: |
          npm run build:js
          git diff --exit-code tack.min.js \
            || { echo "tack.min.js is stale — run 'npm run build:js' and commit it"; exit 1; }
      - run: npm publish --provenance --access public
